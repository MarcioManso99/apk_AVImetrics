name: Gerar APK Balança Avícola

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Recriar esqueleto Android nativo
        run: |
          rm -rf android
          flutter create . --project-name balanca_avicola_pro --org com.jjagro.balanca --platforms=android

      - name: Configurar pubspec.yaml com todas as dependências
        run: |
          cat << 'EOF' > pubspec.yaml
          name: balanca_avicola_pro
          description: "Aplicativo móvel inteligente para pesagem avícola industrial com BLE e ESP32"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_blue_plus: ^1.34.5
            sqflite: ^2.3.3+1
            path: ^1.9.0
            provider: ^6.1.2
            google_fonts: ^6.2.1
            intl: ^0.19.0
            excel: ^4.0.6
            path_provider: ^2.1.3
            share_plus: ^10.0.0
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Corrigir quebra de string no ble_service.dart
        run: |
          if [ -f "lib/services/ble_service.dart" ]; then
            sed -i 's/"CMD:TARE/"CMD:TARE\\n"/g' lib/services/ble_service.dart
            sed -i '/"), withoutResponse: false);/d' lib/services/ble_service.dart
            sed -i 's/"CMD:TARE\\n"/\"CMD:TARE\\n\", withoutResponse: false/g' lib/services/ble_service.dart
          fi

      - name: Inserir permissões BLE e Armazenamento no AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSOES='    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <application'
          sed -i "s|<application|$PERMISSOES|g" $MANIFEST

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Balanca-Avicola-Pro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
