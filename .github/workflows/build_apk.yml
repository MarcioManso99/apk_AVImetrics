name: Gerar APK Balança Avícola

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Recriar estrutura nativa Android moderna
        run: |
          rm -rf android
          flutter create . --project-name balanca_avicola_pro --org com.jjagro.balanca --platforms=android

      - name: Inserir permissões BLE e armazenamento no AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSOES='    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <application'
          sed -i "s|<application|$PERMISSOES|g" $MANIFEST

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Balanca-Avicola-Pro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
