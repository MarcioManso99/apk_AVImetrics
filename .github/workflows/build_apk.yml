name: Gerar APK AVImetrics

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Recriar esqueleto Android nativo
        run: |
          rm -rf android
          flutter create . --project-name avimetrics --org com.jjagro.avimetrics --platforms=android

      - name: Configurar pubspec.yaml com dependencias e icones
        run: |
          cat << 'EOF' > pubspec.yaml
          name: avimetrics
          description: "AVImetrics - Sistema Inteligente de Pesagem Avicola"
          publish_to: 'none'
          version: 1.0.7+8

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_blue_plus: 1.32.9
            sqflite: ^2.3.3+1
            path: ^1.9.0
            provider: ^6.1.2
            google_fonts: ^6.2.1
            intl: ^0.19.0
            excel: ^4.0.6
            path_provider: ^2.1.3
            share_plus: ^10.0.0
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
            flutter_launcher_icons: ^0.13.1

          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "assets/app_icon.png"
            min_sdk_android: 21

          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF

      - name: Gerar Icones do App
        run: |
          flutter pub get
          if [ -f "assets/app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Configurar Android SDKs, Orientacao e Permissoes
        run: |
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' $APP_GRADLE || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' $APP_GRADLE || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' $APP_GRADLE || true
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSOES='    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <application'
          sed -i "s|<application|$PERMISSOES|g" $MANIFEST
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="landscape"/g' $MANIFEST
          sed -i 's/android:label="[^"]*"/android:label="AVImetrics"/g' $MANIFEST

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: AVImetrics-Release
          path: build/app/outputs/flutter-apk/app-release.apk
